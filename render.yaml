# Render Blueprint — deploys the GradeScan API.
# Put this file at the ROOT of the Git repository that contains the contents of the `backend/` folder.
# Render dashboard → New → Blueprint → pick the repo. Render then asks for the secrets marked
# `sync: false` and generates APP_API_KEY for you (copy it from the service's Environment tab
# into the app: Settings → Access key).
services:
  - type: web
    name: gradescan-api
    runtime: node
    plan: free
    region: frankfurt # closest to Egypt; cannot be changed after creation
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Locks the API. Generated once by Render; the app must send the same value.
      - key: APP_API_KEY
        generateValue: true
      # Free key from https://aistudio.google.com/apikey (reads the handwritten Arabic names)
      - key: GEMINI_API_KEY
        sync: false
      # "Continue with Google": the OAuth client from Google Cloud Console (DEPLOY.md, Part 3). It identifies the
      # teacher (name, e-mail) and, on the same page, asks for the per-file drive.file permission that lets the
      # attendance mode create its sheet in the teacher's own Drive.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      # REQUIRED for saving grades and ticking attendance: the whole service-account ("robot") JSON on ONE
      # line (see .env.example; DEPLOY.md, Part 2). Teachers share their sheet with the robot's e-mail as Editor.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: OCR_PROVIDER
        value: gemini
      # The free instance has 512 MB RAM — too little for the offline Tesseract engine, so report
      # Gemini errors instead of crashing on the fallback.
      - key: OCR_FALLBACK_TO_TESSERACT
        value: "false"
